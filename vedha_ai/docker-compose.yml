
services:
  # ── PostgreSQL ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vedha_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vedha_user
      POSTGRES_PASSWORD: vedha_pass
      POSTGRES_DB: vedha_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vedha_user -d vedha_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vedha_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Vedha AI Backend ─────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vedha_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://vedha_user:vedha_pass@postgres:5432/vedha_ai
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mount knowledge base (for RAG)
      - ./app/knowledge:/app/app/knowledge:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ping')\""]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ── Frontend (Vite) ──────────────────────────────
  frontend:
    build:
      context: ./vedha-frontend
      dockerfile: Dockerfile
    container_name: vedha_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1

volumes:
  postgres_data:
  redis_data:
